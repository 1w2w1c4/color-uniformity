# 各 site 的色彩均勻度判定標準。
# - 呼叫 API 時帶 site=<名稱> 即套用該 site 標準；未帶 site 則用 default。
# - 各 site 未寫的欄位會沿用 default。
# - 請求中明確帶入的參數會覆蓋 site 標準（回傳的 applied_settings 會註明來源）。
# - 修改本檔後不需重啟 API，下一次請求即生效。
#
# 可用欄位：
#   threshold       整體（格子）最大允許 ΔE00
#   spot_threshold  小點偵測 ΔE00 門檻（null = 沿用 threshold）
#   min_spot_size   小點最小尺寸，照片長邊的百分比（0.5 = 長邊的 0.5%）；更小的視為灰塵。
#                   以比例表示，照片解析度不同仍是同一標準。可偵測下限約 0.25%
#   rows, cols      整體偵測的切格數
#   margin          每格內縮比例 0–0.5
#   reference       參考色 #RRGGBB。建議維持 null：每張圖自動以自己的主色為基準判斷；
#                   僅在確定有標準色時才填
#   max_gradient    第一階段可容忍的平滑漸層幅度 ΔE00（打光不均造成的左亮右暗等）。
#                   null = 原本做法（各格對主色）。設定後各格改與擬合的平滑漸層比較，
#                   殘差 ≤ threshold 且漸層幅度 ≤ max_gradient 才通過。
#                   ⚠ 幅度在此值內的平順單側褪色會被當成打光放過；根本解法是改善打光或平場校正
#   spot_mode       第二階段比較對象：global = 整張主色（原本做法）；local = 周圍背景。
#                   local 不受打光漸層影響，spot_threshold 可降回約 5；
#                   但比 background_size 大的瑕疵會被當成背景，需靠第一階段抓
#   background_size spot_mode=local 時周圍背景的範圍，長邊百分比（1–50，預設 10）
#
# ⚠ 以下 site 名稱與數值為範例，請改成各廠實際規格。

default:
  threshold: 3.0
  spot_threshold: 10.0  # 小點門檻與整體門檻分開：逐像素比對受雜訊、紋理、反光影響較大。依實際照片測試定為 10
  min_spot_size: 0.5
  rows: 5
  cols: 5
  margin: 0.1
  reference: null
  max_gradient: null    # null = 原本做法
  spot_mode: global     # global = 原本做法
  background_size: 10.0

sites:
  site_a:            # 範例：規格較嚴
    threshold: 2.0
    min_spot_size: 0.35
    rows: 8
    cols: 8

  site_b:            # 範例：規格較寬
    threshold: 4.0
    min_spot_size: 1.0

  site_c:            # 範例：打光不均的站點——容忍平滑漸層，小點改與周圍比較
    threshold: 3.0
    max_gradient: 25.0
    spot_mode: local
    spot_threshold: 5.0
